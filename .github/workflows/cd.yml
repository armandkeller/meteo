# Déploiement en production sur Vercel après le merge d'une PR dans main.
# Le déploiement automatique de Vercel sur push est désactivé (vercel.json).
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un seul déploiement à la fois, sans annuler celui en cours
concurrency:
  group: deploiement-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml

  deploiement:
    name: Déploiement Vercel
    needs: validation
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_CLI: vercel@60.0.0
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Récupération de la config Vercel
        run: pnpm dlx $VERCEL_CLI pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: pnpm dlx $VERCEL_CLI build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NITRO_PRESET: vercel

      - name: Déploiement
        id: deploy
        run: |
          url=$(pnpm dlx $VERCEL_CLI deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
